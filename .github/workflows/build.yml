name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the job only needs to read the repository to build it.
permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same ref so a rapid push sequence does not
  # queue up redundant builds.
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle needs the Android SDK. The runner image ships one, but the SDK
      # version this project targets has to be present, so install the exact
      # platform and build-tools it asks for. The action sets ANDROID_SDK_ROOT
      # and accepts the licences, so no separate sdkmanager step is needed.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The build reads the SDK location from local.properties, which is not
      # committed. Point it at the SDK the previous step installed.
      - name: Configure SDK location
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # The Gradle build names the output BerryForge.apk itself (see the
      # androidComponents block in app/build.gradle.kts), so there is no rename
      # step here — the artefact is already called the right thing.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BerryForge
          path: app/build/outputs/apk/debug/BerryForge.apk
          if-no-files-found: error
          retention-days: 30
